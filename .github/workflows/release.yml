name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Check tag and version
        shell: bash
        run: |
          set -euo pipefail
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          [[ "$GITHUB_REF_NAME" =~ $pattern ]] || { echo 'Invalid SemVer tag' >&2; exit 1; }
          [[ "$(dotnet msbuild FoodMarket/FoodMarket.csproj -getProperty:Version)" == "${GITHUB_REF_NAME#v}" ]] || {
            echo 'Tag does not match Directory.Build.props' >&2; exit 1;
          }
      - run: dotnet test FoodMarket.Tests/FoodMarket.Tests.csproj --configuration Release
      - run: dotnet build FoodMarket/FoodMarket.csproj --configuration Release --no-restore

  package:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Publish and archive
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish FoodMarket/FoodMarket.csproj --configuration Release --runtime '${{ matrix.rid }}' --self-contained true -p:PublishSingleFile=true -o artifacts/publish
          if [[ '${{ matrix.rid }}' == win-x64 ]]; then cp scripts/run-foodmarket.cmd artifacts/publish/run-foodmarket.cmd; fi
          (cd artifacts/publish && zip -q -r "../FoodMarket-${{ matrix.rid }}.zip" .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foodmarket-${{ matrix.rid }}
          path: artifacts/FoodMarket-${{ matrix.rid }}.zip
          if-no-files-found: error

  github-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          sha256sum FoodMarket-*.zip > SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            args=(--verify-tag --generate-notes --title "$TAG")
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" release-assets/* "${args[@]}"
          fi
